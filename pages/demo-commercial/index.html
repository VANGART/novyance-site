<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, follow">

<meta name="description" content="Démo interactive, données fictives : relances, pipeline, contacts et prospection, avec le récap du matin.">
<meta property="og:title" content="Commercial · démo Novyance">
<meta property="og:description" content="Démo interactive, données fictives : relances, pipeline, contacts et prospection, avec le récap du matin.">

<meta property="og:image" content="https:/assets/nv-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>

:root{
  --canvas:#F3F6FA; --surface:#FFFFFF; --sunk:#E9EEF5; --line:#DCE3EC; --line2:#EBEFF5;
  --ink:#2B1A12; --ink2:#5E5049; --ink3:#948A85;
  --late:#D2453B; --late-s:#FBE7E5; --ok:#23845A; --ok-s:#E1F2EA; --warn:#C98A12; --warn-s:#FCF1D9;
  --nv-rose:#FF9EBC; --nv-orange:#FF681F;
  --ac:#2F6B4F; --ac-s:#E3EFE8;
  --t:'Space Grotesk','DM Sans',system-ui,sans-serif; --b:'DM Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --e:cubic-bezier(.22,.61,.36,1);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0;}
body{background:var(--canvas);color:var(--ink);font-family:var(--b);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;}
input,select{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px;}
h1,h2,h3{font-family:var(--t);font-weight:600;letter-spacing:-.015em;line-height:1.15;}

/* bandeau démo */
.demo{background:var(--ink);color:#fff;font-size:13px;}
.demo .in{max-width:1320px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.demo .mk{font-family:var(--t);font-weight:700;letter-spacing:-.02em;}
.demo .mk i{color:var(--nv-orange);font-style:normal;}
.demo .txt{color:rgba(255,255,255,.62);}
.demo .pf{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
.demo .pf button{padding:5px 12px;border-radius:100px;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.85);font-size:12.5px;}
.demo .pf button[aria-pressed="true"]{background:var(--nv-rose);border-color:var(--nv-rose);color:var(--ink);font-weight:600;}
.demo .rs{font-size:12.5px;color:rgba(255,255,255,.55);text-decoration:underline;text-underline-offset:3px;}

/* barre client */
.bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;}
.bar .in{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;}
.logo{width:38px;height:38px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center;font-family:var(--t);font-weight:700;font-size:16px;flex:none;}
.who b{display:block;font-family:var(--t);font-size:16px;font-weight:600;}
.who span{font-size:12.5px;color:var(--ink3);}
.role{margin-left:auto;display:flex;background:var(--sunk);border-radius:10px;padding:3px;}
.role button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink2);}
.role button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(43,26,18,.12);}

/* structure */
.app{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:200px 1fr;gap:0;min-height:calc(100vh - 110px);}
nav.side{padding:22px 12px;border-right:1px solid var(--line);}
nav.side button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 12px;border-radius:9px;font-size:14px;color:var(--ink2);text-align:left;margin-bottom:2px;}
nav.side button:hover{background:var(--sunk);}
nav.side button[aria-current="page"]{background:var(--ac-s);color:var(--ink);font-weight:600;}
nav.side .n{font-size:12px;min-width:20px;height:20px;border-radius:100px;display:grid;place-items:center;background:var(--sunk);color:var(--ink2);padding:0 6px;}
nav.side .n.late{background:var(--late);color:#fff;}
main{padding:24px 28px 90px;min-width:0;}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.hd h1{font-size:24px;}
.hd p{color:var(--ink3);font-size:13.5px;}

/* chiffres du jour */
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
.kp.five{grid-template-columns:repeat(5,1fr);}
.k{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;transition:border-color .2s;}
.k:hover{border-color:var(--ink3);}
.k b{display:block;font-family:var(--t);font-size:28px;font-weight:600;line-height:1;}
.k span{display:block;font-size:13px;color:var(--ink2);margin-top:6px;}
.k small{display:block;font-size:12px;color:var(--ink3);margin-top:2px;}
.k.late b{color:var(--late);}
.k.ok b{color:var(--ok);}

.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px;}
.panel>h2{font-size:15px;padding:13px 16px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.panel>h2 span{font-family:var(--b);font-weight:400;font-size:12.5px;color:var(--ink3);}
.empty{padding:18px 16px;color:var(--ink3);font-size:13.5px;}

/* ressources du jour */
.rr{display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line2);}
.rr:first-of-type{border-top:0;}
.rr .rn b{display:block;font-size:14px;}
.rr .rn small{color:var(--ink3);font-size:12px;}
.rr .job{min-width:0;}
.rr .job b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rr .job small{color:var(--ink2);font-size:12.5px;}
.prog{height:5px;background:var(--sunk);border-radius:5px;margin-top:7px;overflow:hidden;}
.prog i{display:block;height:100%;background:var(--ac);border-radius:5px;transition:width .6s var(--e);}
.idle{color:var(--ink3);font-size:13px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;background:var(--ac);color:#fff;white-space:nowrap;transition:filter .2s;}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{background:var(--sunk);color:var(--ink);}
.btn.warn{background:var(--late-s);color:var(--late);}
.btn.big{padding:13px 18px;font-size:14.5px;border-radius:11px;}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}

/* listes */
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line2);width:100%;text-align:left;}
.li:first-of-type{border-top:0;}
button.li:hover{background:var(--canvas);}
.li .m{flex:1;min-width:0;}
.li .m b{display:block;font-weight:600;font-size:13.5px;}
.li .m small{color:var(--ink3);font-size:12.5px;}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink3);}
.dot.late{background:var(--late);} .dot.warn{background:var(--warn);} .dot.ok{background:var(--ok);} .dot.ac{background:var(--ac);}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:100px;background:var(--sunk);color:var(--ink2);white-space:nowrap;}
.tag.late{background:var(--late-s);color:var(--late);} .tag.warn{background:var(--warn-s);color:#8A5E08;} .tag.ok{background:var(--ok-s);color:var(--ok);}
.feed .li{font-size:13px;}
.feed .h{color:var(--ink3);font-size:12px;width:38px;flex:none;}

/* planning */
.board-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;}
.board{min-width:820px;position:relative;}
.brow{display:grid;grid-template-columns:170px 1fr;border-top:1px solid var(--line2);}
.brow:first-child{border-top:0;}
.bhead .days{display:grid;grid-template-columns:repeat(5,1fr);}
.bhead .days div{padding:11px 10px;font-size:12.5px;color:var(--ink2);border-left:1px solid var(--line2);}
.bhead .days div b{font-family:var(--t);font-weight:600;color:var(--ink);font-size:13.5px;margin-right:4px;}
.bhead .days div.today{background:var(--ac-s);}
.blab{padding:12px 14px;border-right:1px solid var(--line2);}
.blab b{display:block;font-size:13.5px;}
.blab small{font-size:12px;color:var(--ink3);}
.load{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:var(--ink2);}
.load i{flex:1;height:4px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden;}
.load i::after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--ac);border-radius:4px;}
.load.hi i::after{background:var(--late);}
.track{position:relative;display:grid;grid-template-columns:repeat(10,1fr);grid-auto-rows:40px;row-gap:6px;padding:8px 0;min-height:56px;
  background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(20% - 1px),var(--line2) calc(20% - 1px),var(--line2) 20%);}
.blk{margin:0 3px;border-radius:8px;padding:5px 9px;text-align:left;font-size:12.5px;line-height:1.25;overflow:hidden;border:1px solid transparent;display:flex;flex-direction:column;justify-content:center;min-width:0;transition:transform .15s var(--e),box-shadow .2s;}
.blk:hover{transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(43,26,18,.5);}
.blk b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.blk small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8;font-size:11.5px;}
.blk.planifie{background:var(--surface);border-color:var(--ac);color:var(--ink);border-style:dashed;}
.blk.encours{background:var(--ac);color:#fff;}
.blk.late{box-shadow:inset 3px 0 0 var(--late);}
.blk.encours.late{box-shadow:inset 4px 0 0 #FFB4AC;}
.blk.moved{animation:pop .5s var(--e);}
@keyframes pop{0%{transform:scale(.94);}60%{transform:scale(1.03);}100%{transform:none;}}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--late);z-index:3;pointer-events:none;}
.now::before{content:attr(data-h);position:absolute;top:-1px;left:4px;font-size:10.5px;font-weight:600;color:var(--late);background:var(--surface);padding:0 3px;border-radius:3px;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:12px 2px 0;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.sw{width:18px;height:10px;border-radius:3px;display:inline-block;}
.tray{margin-top:18px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;}
.chip{padding:8px 12px;border-radius:10px;border:1px dashed var(--ink3);background:var(--surface);text-align:left;font-size:13px;}
.chip b{display:block;font-weight:600;}
.chip small{color:var(--ink3);font-size:12px;}

/* suivi (colonnes) */
.cols{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;}
.col{background:var(--sunk);border-radius:12px;padding:10px;min-height:120px;}
.col h3{font-family:var(--b);font-size:13px;font-weight:600;color:var(--ink2);padding:2px 4px 10px;display:flex;justify-content:space-between;}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;transition:border-color .2s;}
.card:hover{border-color:var(--ink3);}
.card b{display:block;font-size:13.5px;font-weight:600;}
.card small{display:block;color:var(--ink3);font-size:12px;margin:2px 0 7px;}
.card .rowt{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.card .val{margin-left:auto;font-size:12px;color:var(--ink2);font-weight:600;}

/* achats */
.add{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line2);background:var(--canvas);}
.add input,.add select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;font-size:13.5px;min-width:0;}
.add input{flex:2 1 220px;} .add select{flex:1 1 180px;}
.a3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;}
.a3>div{border-left:1px solid var(--line2);min-width:0;}
.a3>div:first-child{border-left:0;}
.a3 h3{font-family:var(--b);font-size:13px;font-weight:600;color:var(--ink2);padding:12px 16px 4px;}

/* équipe */
.team .li{display:grid;grid-template-columns:1fr 180px 170px;gap:14px;}
.pres{display:flex;gap:4px;}
.pres span{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--ok-s);color:var(--ok);}
.pres span.off{background:var(--sunk);color:var(--ink3);text-decoration:line-through;}

/* tiroir */
.scrim{position:fixed;inset:0;background:rgba(43,26,18,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
.scrim.on{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:51;transform:translateX(102%);transition:transform .3s var(--e);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.drawer.on{transform:none;}
.dr-h{padding:20px 22px 14px;border-bottom:1px solid var(--line2);}
.dr-h small{color:var(--ink3);font-size:12.5px;}
.dr-h h2{font-size:20px;margin:4px 0 8px;}
.dr-b{padding:16px 22px;overflow:auto;flex:1;}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13.5px;margin-bottom:18px;}
.kv dt{color:var(--ink3);}
.pbx{background:var(--late-s);color:#8C2A22;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:16px;}
.dr-b h3{font-family:var(--b);font-size:12.5px;font-weight:600;color:var(--ink3);margin:14px 0 8px;}
.stack{display:flex;flex-direction:column;gap:8px;}
.resp{display:flex;gap:6px;flex-wrap:wrap;}
.resp button{padding:8px 12px;border-radius:9px;background:var(--sunk);font-size:13px;}
.resp button:hover{background:var(--ac-s);}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:9px;font-size:18px;color:var(--ink2);}
.x:hover{background:var(--sunk);}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .3s var(--e);z-index:60;max-width:calc(100% - 32px);}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* équipe : vue simplifiée */
.mine .rr{grid-template-columns:1fr;gap:10px;}
.mine .acts{justify-content:flex-start;}
.note{font-size:12.5px;color:var(--ink3);margin-top:-8px;margin-bottom:16px;}

@media (max-width:980px){
  .grid2{grid-template-columns:1fr;}
  .kp,.kp.five{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;}
  nav.side{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;}
  nav.side button{flex-direction:column;justify-content:center;gap:2px;font-size:11.5px;padding:6px 4px;margin:0;text-align:center;}
  nav.side .n{position:absolute;top:1px;right:6px;min-width:16px;height:16px;font-size:10px;padding:0 4px;}
  nav.side button{position:relative;}
  main{padding:18px 16px 100px;}
  .rr{grid-template-columns:1fr;gap:8px;}
  .acts{justify-content:flex-start;}
  .a3{grid-template-columns:1fr;}
  .a3>div{border-left:0;border-top:1px solid var(--line2);}
  .team .li{grid-template-columns:1fr;}
  .demo .txt{display:none;}
  .demo .in{padding:8px 14px;gap:8px;}
  .demo .pf{margin-left:0;flex-wrap:nowrap;overflow-x:auto;}
  .demo .pf button{white-space:nowrap;padding:4px 10px;}
  .kp.five .k:last-child{grid-column:span 2;}
  .role button{padding:7px 10px;}
  .who span{display:none;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

.kwin{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--ac);color:#fff;border-radius:16px;margin-bottom:14px;overflow:hidden;}
.kwin>div{padding:18px 20px;border-left:1px solid rgba(255,255,255,.18);}
.kwin>div:first-child{border-left:0;}
.kwin b{display:block;font-family:var(--t);font-size:32px;font-weight:600;line-height:1;letter-spacing:-.02em;}
.kwin span{display:block;font-size:12.5px;opacity:.85;margin-top:7px;}
@media (max-width:760px){.kwin{grid-template-columns:1fr 1fr;}.kwin>div:nth-child(3){border-left:0;}.kwin>div{border-top:1px solid rgba(255,255,255,.18);}}
.recap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;display:grid;grid-template-columns:44px 1fr;gap:14px;}
.recap .av{width:44px;height:44px;border-radius:12px;background:var(--ac-s);color:var(--ac);display:grid;place-items:center;font-family:var(--t);font-weight:700;}
.recap p{font-size:14.5px;line-height:1.6;max-width:70ch;}
.recap p+p{margin-top:6px;color:var(--ink2);font-size:13.5px;}
.draft{border-top:1px solid var(--line2);padding:16px;}
.draft:first-of-type{border-top:0;}
.draft .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;}
.draft .top b{font-size:14px;}
.draft .why{font-size:12.5px;color:var(--ink3);margin-top:2px;}
.draft .obj{font-size:13px;font-weight:600;margin:12px 0 4px;}
.draft textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:13.5px;line-height:1.55;color:var(--ink);background:var(--canvas);resize:vertical;}
.draft textarea:focus{outline:none;border-color:var(--ac);background:#fff;}
.draft .acts{justify-content:flex-start;margin-top:10px;}
.draft.done{opacity:.55;}
.draft.done textarea{display:none;}
.guard{font-size:12.5px;color:var(--ink3);padding:12px 16px;border-top:1px solid var(--line2);background:var(--canvas);}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;}
.bar2{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;border-top:1px solid var(--line2);}
.bar2:first-of-type{border-top:0;}
.bar2 span{width:150px;flex:none;color:var(--ink2);}
.bar2 i{flex:1;height:10px;border-radius:10px;background:var(--sunk);position:relative;overflow:hidden;}
.bar2 i::after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--ac);border-radius:10px;}
.bar2 b{width:70px;text-align:right;}
.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14px;width:min(320px,100%);}
.hist .li{font-size:13px;}
.hist .h{color:var(--ink3);font-size:12px;width:70px;flex:none;}
@media (max-width:760px){.kwin{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--ac);color:#fff;border-radius:16px;margin-bottom:14px;overflow:hidden;}
.kwin>div{padding:18px 20px;border-left:1px solid rgba(255,255,255,.18);}
.kwin>div:first-child{border-left:0;}
.kwin b{display:block;font-family:var(--t);font-size:32px;font-weight:600;line-height:1;letter-spacing:-.02em;}
.kwin span{display:block;font-size:12.5px;opacity:.85;margin-top:7px;}

function ct(id){return st().c[id];}
function arelancer(c){return (c.stade==='prospection'||c.stade==='encours')&&c.next!=null&&c.next<=0;}
function endormi(c){return (c.stade==='prospection'||c.stade==='encours')&&c.next==null&&c.last<=-30;}
function visible(c){return ROLE==='direction'||c.resp===P.me;}
function mesC(){return st().c.filter(visible);}

var main=document.getElementById('main');

    (ROLE==='direction'?'<p>Cette nuit, '+P.nouveaux+' nouveaux contacts correspondant à votre cible ('+esc(P.cible)+') ont été trouvés et ajoutés en prospection.</p>':'')+'</div></div>';

  dr.forEach(function(d){var c=ct(d.cid);
    h+='<div class="draft'+(d.etat!=='pret'?' done':'')+'"><div class="top"><div><b>'+esc(c.pers)+', '+esc(c.nom)+'</b><div class="why">'+esc(d.why)+'</div></div>'+(d.etat==='boite'?'<span class="tag ok">dans vos brouillons</span>':d.etat==='ecarte'?'<span class="tag">écarté</span>':'<button class="btn ghost" data-open="'+c.id+'" style="padding:5px 10px;font-size:12px">Fiche</button>')+'</div>';
    if(d.etat==='pret')h+='<div class="obj">'+esc(d.obj)+'</div><textarea data-d="'+d.id+'" aria-label="Message à '+esc(c.pers)+'">'+esc(d.txt)+'</textarea><div class="acts"><button class="btn" data-a="valider" data-id="'+d.id+'">Mettre dans ma boîte mail</button><button class="btn ghost" data-a="ecarter" data-id="'+d.id+'">Écarter</button></div>';
    h+='</div>';});

function rel(d){return d===0?"aujourd'hui":d===-1?'hier':'il y a '+(-d)+' j';}
function vPipe(){

  [['prospection','Prospection'],['encours','Projet en cours'],['signe','Signé'],['perdu','Perdu']].forEach(function(s){
    var L=C.filter(function(c){return c.stade===s[0];}).sort(function(a,b){return (a.next==null?99:a.next)-(b.next==null?99:b.next);});
    h+='<div class="col"><h3><span>'+s[1]+'</span><span>'+L.length+'</span></h3>';
    L.forEach(function(c){h+='<button class="card" data-open="'+c.id+'"><b>'+esc(c.nom)+'</b><small>'+esc(c.pers)+', '+esc(c.type.toLowerCase())+'</small><div class="rowt">'+(tagsOf(c)||(c.next!=null?'<span class="tag">relance '+(c.next>0?'dans '+c.next+' j':'')+'</span>':''))+(ROLE==='direction'?'<span class="val">'+eur(c.pot)+'</span>':'')+'</div></button>';});
    if(!L.length)h+='<div class="empty" style="padding:6px 4px">Vide.</div>';
    h+='</div>';});
  return h+'</div>';
}
function vContacts(){
  var C=mesC().filter(function(c){return !Q||(c.nom+' '+c.pers+' '+c.type).toLowerCase().indexOf(Q.toLowerCase())>=0;});
  var h='<div class="hd"><h1>Contacts</h1><input class="search" id="q" placeholder="Chercher un nom, une structure" value="'+esc(Q)+'" aria-label="Rechercher"></div><div class="panel">';
  C.forEach(function(c){var lb=STADES.filter(function(s){return s[0]===c.stade;})[0][1];h+='<button class="li" data-open="'+c.id+'"><span class="dot '+(arelancer(c)?'late':c.stade==='signe'?'ok':endormi(c)?'warn':'ac')+'"></span><div class="m"><b>'+esc(c.nom)+'</b><small>'+esc(c.pers)+', '+esc(c.type)+', via '+esc(c.canal.toLowerCase())+'</small></div>'+tagsOf(c)+'<span class="tag">'+lb+'</span></button>';});
  if(!C.length)h+='<div class="empty">Aucun contact ne correspond.</div>';
  return h+'</div>';
}
function vAnalyse(){
  var C=st().c,n=C.length,sig=C.filter(function(c){return c.stade==='signe';}).length,enc=C.filter(function(c){return c.stade==='encours';}).length,per=C.filter(function(c){return c.stade==='perdu';}).length;
  var h='<div class="hd"><h1>Ce qui marche</h1><p>Sur les 90 derniers jours.</p></div>';
  h+='<div class="kp"><div class="k"><b>'+n+'</b><span>Contacts suivis</span><small>+'+P.nouveaux+' trouvés cette nuit</small></div><div class="k"><b>'+(enc+sig)+'</b><span>Ont répondu</span><small>'+Math.round((enc+sig)/n*100)+' % des contacts</small></div><div class="k ok"><b>'+sig+'</b><span>Signés</span><small>'+eur(C.filter(function(c){return c.stade==='signe';}).reduce(function(s,c){return s+c.pot;},0))+'</small></div><div class="k"><b>'+st().sent+'</b><span>Messages validés</span><small>depuis ce matin</small></div></div>';
  h+='<div class="grid2"><div class="panel"><h2>Quel canal ouvre vraiment les portes<span>taux de réponse</span></h2>';
  CANAUX.forEach(function(k){var L=C.filter(function(c){return c.canal===k;});if(!L.length)return;var r=L.filter(function(c){return c.stade==='encours'||c.stade==='signe';}).length/L.length;h+='<div class="bar2"><span>'+k+'</span><i style="--w:'+Math.round(r*100)+'%"></i><b>'+Math.round(r*100)+' %</b></div>';});
  h+='</div><div class="panel"><h2>Qui avance<span>par type de cible</span></h2>';
  P.types.forEach(function(k){var L=C.filter(function(c){return c.type===k;});if(!L.length)return;var r=L.filter(function(c){return c.stade==='encours'||c.stade==='signe';}).length/L.length;h+='<div class="bar2"><span>'+k+'</span><i style="--w:'+Math.round(r*100)+'%"></i><b>'+L.length+' contact'+(L.length>1?'s':'')+'</b></div>';});
  h+='</div></div>';
  h+='<div class="panel"><h2>Ce qui coince</h2><div class="li"><span class="dot warn"></span><div class="m"><b>'+C.filter(endormi).length+' contacts endormis</b><small>Plus d\u2019un mois sans échange ni relance prévue. L\u2019assistant peut préparer une relance pour chacun.</small></div></div><div class="li"><span class="dot late"></span><div class="m"><b>'+per+' perdu'+(per>1?'s':'')+'</b><small>'+C.filter(function(c){return c.stade==='perdu';}).map(function(c){return esc(c.nom)+' : '+esc(c.note.toLowerCase());}).join('. ')+'</small></div></div></div>';
  return h;
}
function renderChrome(){
  document.documentElement.style.setProperty('--ac',P.accent);document.documentElement.style.setProperty('--ac-s',P.accentS);
  document.getElementById('logo').textContent=P.mono;document.getElementById('cname').textContent=P.nom;document.getElementById('cmetier').textContent=P.metier;
  var C=mesC(),r=C.filter(arelancer).length,pr=st().d.filter(function(d){return d.etat==='pret'&&visible(ct(d.cid));}).length;
  var it=[['matin','Ce matin',pr?'<span class="n late">'+pr+'</span>':''],['pipe','Pipeline',r?'<span class="n">'+r+'</span>':''],['contacts','Contacts','']];
  if(ROLE==='direction')it.push(['analyse','Ce qui marche','']);else if(VIEW==='analyse')VIEW='matin';
  document.getElementById('nav').innerHTML=it.map(function(i){return '<button data-view="'+i[0]+'"'+(VIEW===i[0]?' aria-current="page"':'')+'><span>'+i[1]+'</span>'+i[2]+'</button>';}).join('');
  document.querySelectorAll('.role button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.role===ROLE?'true':'false');});
  document.querySelectorAll('#profiles button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.p===PK?'true':'false');});
}
function render(){renderChrome();main.innerHTML=VIEW==='pipe'?vPipe():VIEW==='contacts'?vContacts():VIEW==='analyse'?vAnalyse():vMatin();if(OPEN!=null)openC(OPEN,true);}

var drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim');
function openC(id,refresh){var c=ct(id);OPEN=id;
  var h='<div class="dr-h"><small>'+esc(c.type)+', via '+esc(c.canal.toLowerCase())+'</small><h2>'+esc(c.nom)+'</h2><div style="display:flex;gap:6px;flex-wrap:wrap">'+tagsOf(c)+'</div></div><div class="dr-b">';
  h+='<dl class="kv"><dt>Contact</dt><dd>'+esc(c.pers)+'</dd><dt>Suivi par</dt><dd>'+esc(c.resp)+'</dd><dt>Dernier échange</dt><dd>'+rel(c.last)+'</dd><dt>Prochaine relance</dt><dd>'+(c.next==null?'aucune':c.next<=0?'en retard':'dans '+c.next+' j')+'</dd>'+(ROLE==='direction'?'<dt>Potentiel</dt><dd>'+eur(c.pot)+'</dd>':'')+'</dl>';
  h+='<h3>Stade</h3><div class="resp">'+STADES.map(function(s){return '<button data-a="stade" data-id="'+c.id+'" data-s="'+s[0]+'"'+(c.stade===s[0]?' style="background:var(--ac);color:#fff"':'')+'>'+s[1]+'</button>';}).join('')+'</div>';
  h+='<h3>Relance</h3><div class="resp"><button data-a="relance" data-id="'+c.id+'" data-s="0">Relancé aujourd\u2019hui</button><button data-a="relance" data-id="'+c.id+'" data-s="7">Relancer dans 7 j</button><button data-a="relance" data-id="'+c.id+'" data-s="30">Dans un mois</button></div>';
  h+='<h3>Historique</h3><div class="hist">';c.hist.slice().sort(function(a,b){return b.d-a.d;}).forEach(function(e){h+='<div class="li" style="padding:8px 0"><span class="h">'+rel(e.d)+'</span><div class="m">'+esc(e.t)+'</div></div>';});
  h+='</div></div>';document.getElementById('dr').innerHTML=h;
  if(!refresh){drawer.classList.add('on');scrim.classList.add('on');drawer.setAttribute('aria-hidden','false');}}
function close(){OPEN=null;drawer.classList.remove('on');scrim.classList.remove('on');drawer.setAttribute('aria-hidden','true');}
scrim.addEventListener('click',close);document.getElementById('dx').addEventListener('click',close);document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
var tt;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},2600);}

var ACT={
  reponse:function(i){var r=st().r[i],c=ct(r.cid);r.done=true;c.last=0;if(r.quand==='signature'){c.stade='signe';c.next=null;st().sig=(st().sig||0)+c.pot;c.hist.push({d:0,t:'Signé'});toast('Signé : '+c.nom+', '+eur(c.pot)+'. Le pilotage est mis à jour');}else{c.stade='encours';c.next=null;c.hist.push({d:0,t:'Rendez-vous '+r.quand});toast('Rendez-vous '+r.quand+' ajouté à votre agenda, invitation envoyée en brouillon');}},
  ajout:function(i){var f=st().f[i];f.done=true;var id=st().c.length;st().c.push({id:id,nom:f.nom,pers:'à identifier',type:f.type,canal:'Mail',stade:'prospection',last:0,next:1,pot:0,resp:P.me,note:f.sig,hist:[{d:0,t:'Trouvé par l\u2019assistant : '+f.sig}]});toast('Ajouté. Le brouillon d\u2019approche sera prêt demain matin');},
  valider:function(id){var d=st().d[id],ta=document.querySelector('textarea[data-d="'+id+'"]');if(ta)d.txt=ta.value;d.etat='boite';var c=ct(d.cid);c.last=0;c.next=7;c.hist.push({d:0,t:'Message validé : '+d.obj});st().sent++;toast('Dans vos brouillons. Relance prévue dans 7 jours.');},
  ecarter:function(id){st().d[id].etat='ecarte';toast('Brouillon écarté');},
  stade:function(id,s){var c=ct(id);c.stade=s;if(s==='signe'||s==='perdu')c.next=null;c.hist.push({d:0,t:'Passé en '+STADES.filter(function(x){return x[0]===s;})[0][1].toLowerCase()});toast('Stade mis à jour');},
  relance:function(id,s){var c=ct(id);s=+s;if(s===0){c.last=0;c.next=7;c.hist.push({d:0,t:'Relancé'});toast('Noté. Prochaine relance dans 7 jours.');}else{c.next=s;toast('Relance prévue dans '+s+' jours');}}
};
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-a]');if(a){ACT[a.dataset.a](+a.dataset.id,a.dataset.s);render();return;}
  var o=e.target.closest('[data-open]');if(o){openC(+o.dataset.open);return;}
  var v=e.target.closest('[data-view]');if(v){VIEW=v.dataset.view;close();render();window.scrollTo({top:0});return;}
  var r=e.target.closest('[data-role]');if(r){ROLE=r.dataset.role;close();render();toast(ROLE==='direction'?'Vue direction : toute l\u2019équipe, potentiels et analyses':'Vue commercial : uniquement les contacts de '+P.me);return;}
  var p=e.target.closest('[data-p]');if(p){PK=p.dataset.p;P=PROFILES[PK];if(!S[PK])S[PK]=build();close();render();}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){Q=e.target.value;var pos=e.target.selectionStart;render();var q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos);}});
document.getElementById('reset').addEventListener('click',function(){S={};S[PK]=build();close();render();toast('Démo réinitialisée');});
document.getElementById('profiles').innerHTML=[['menuiserie','Menuiserie'],['traiteur','Traiteur'],['cabinet','Cabinet comptable']].map(function(x){return '<button data-p="'+x[0]+'">'+x[1]+'</button>';}).join('');
P=PROFILES[PK];S[PK]=build();render();
})();
</script>
